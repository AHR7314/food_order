{% extends 'base.html' %}
{% load i18n %}
{% block title %}{% trans "Delete food" %}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm"><div class="card-body">
      <h3 class="mb-3">{% trans "Delete food" %}</h3>
      <p><strong>{{ food.name }}</strong></p>
      <p>{% trans "Are you sure you want to delete this food?" %}</p>
      <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger">{% trans "Delete" %}</button>
        <a class="btn btn-link" href="{% url 'restaurants:owner_dashboard' %}">{% trans "Cancel" %}</a>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
